[project]
name = "adaptive-computation"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "adaptive-skill",
    "adaptive-service",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["skill", "service"]

[tool.uv.sources]
adaptive-skill = { workspace = true }
adaptive-service = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    "skill",
    "service",
]
testpaths = [
    "skill/tests",
    "service/tests",
]
